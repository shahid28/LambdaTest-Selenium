image:
  file: .gitpod.Dockerfile

tasks:
  - name: Install Java and Dependencies
    before: sdk install java 17.0.4.1-tem
    init: mvn install -DskipTests=true
    command: mvn test

# Environment variables for LambdaTest credentials
env:
  LT_USERNAME: ${LT_USERNAME}
  LT_ACCESS_KEY: ${LT_ACCESS_KEY}

ports:
  - port: 4444
    onOpen: ignore
  - port: 7900
    onOpen: ignore

vscode:
  extensions:
    - vscjava.vscode-java-pack
    - redhat.java
    - vscjava.vscode-maven
